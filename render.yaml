services:
  - type: web
    name: noticias-de-ontem-web
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noticias-de-ontem-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: noticias-de-ontem-queue
          property: connectionString
      - key: TOPIC_TASK_ALWAYS_EAGER
        value: "false"
      - key: TOPIC_MAX_ACTIVE_JOBS
        value: "8"
      - key: TOPIC_JOB_SLOT_TTL_SECONDS
        value: "7200"
      - key: TOPIC_JOB_STALE_SECONDS
        value: "7200"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: TOPIC_CREATE_RATE_LIMIT
        value: "5"
      - key: TOPIC_CREATE_GLOBAL_RATE_LIMIT
        value: "30"
      - key: TOPIC_POLL_RATE_LIMIT
        value: "120"
      - key: TOPIC_POLL_GLOBAL_RATE_LIMIT
        value: "600"
      - key: CALENDAR_RATE_LIMIT
        value: "60"
      - key: CALENDAR_GLOBAL_RATE_LIMIT
        value: "300"
      - key: NEWS_RATE_LIMIT
        value: "120"
      - key: NEWS_GLOBAL_RATE_LIMIT
        value: "600"
      - key: ADMIN_RATE_LIMIT
        value: "10"
      - key: RATE_LIMIT_TRUST_PROXY_HEADERS
        value: "true"
      - key: SITE_SYNC_TOKEN
        sync: false
      - key: SITE_PUBLIC_URL
        sync: false
      - key: OPENSEARCH_URL
        sync: false
      - key: OPENSEARCH_API_KEY
        sync: false
      - key: OPENSEARCH_INDEX
        value: noticias-ontem-captures-v1

  - type: worker
    name: noticias-de-ontem-worker
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: celery -A backend.tasks.celery_app worker --loglevel=INFO --concurrency=1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noticias-de-ontem-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: noticias-de-ontem-queue
          property: connectionString
      - key: TOPIC_MAX_PROBES_BACKEND
        value: "5000"
      - key: ARQUIVO_TOPIC_MIN_INTERVAL
        value: "0.31"
      - key: OPENSEARCH_URL
        sync: false
      - key: OPENSEARCH_API_KEY
        sync: false
      - key: OPENSEARCH_INDEX
        value: noticias-ontem-captures-v1

  - type: worker
    name: noticias-de-ontem-indexer
    runtime: python
    buildCommand: pip install -r backend/indexer-requirements.txt
    startCommand: python -u backend/index_update_worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: noticias-de-ontem-db
          property: connectionString
      - key: OPENSEARCH_URL
        sync: false
      - key: OPENSEARCH_API_KEY
        sync: false
      - key: OPENSEARCH_INDEX
        value: noticias-ontem-captures-v1
      - key: S3_ENDPOINT_URL
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_PREFIX
        value: noticias-de-ontem
      - key: INDEX_WORKSPACE
        value: /data
      - key: INDEX_UPDATE_INTERVAL_SECONDS
        value: "86400"
      - key: INDEX_REFRESH_CDXJ
        value: "true"
    disk:
      name: indexer-data
      mountPath: /data
      sizeGB: 20

  - type: keyvalue
    name: noticias-de-ontem-queue
    ipAllowList: []

databases:
  - name: noticias-de-ontem-db
