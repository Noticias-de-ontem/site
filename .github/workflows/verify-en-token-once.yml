name: Verify EN token once
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Identify saved EN ID object type
        env:
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
        run: |
          python3 - <<'PYEOF'
          import os
          import requests

          token = os.environ.get("IG_ACCESS_TOKEN_EN", "")
          user_id = os.environ.get("IG_USER_ID_EN", "")
          base = "https://graph.facebook.com/v25.0"
          for fields in ("id,account_type", "id,category", "id,username"):
              r = requests.get(
                  f"{base}/{user_id}",
                  params={"fields": fields, "access_token": token},
                  timeout=30,
              )
              d = r.json()
              print(f"FIELDS {fields} -> STATUS {r.status_code} -> {d}")
          PYEOF
