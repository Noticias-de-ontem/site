name: Check EN account once
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Check EN Page and linked Instagram
        env:
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
        run: |
          python3 - <<'PYEOF'
          import os
          import requests

          token = os.environ.get("IG_ACCESS_TOKEN_PT", "")
          base = "https://graph.facebook.com/v25.0"
          page_id = "61596236577237"

          r = requests.get(
              f"{base}/{page_id}",
              params={"fields": "id,name,instagram_business_account", "access_token": token},
              timeout=30,
          )
          print("PAGE_STATUS:", r.status_code)
          data = r.json()
          print("PAGE_ID:", data.get("id", ""))
          print("PAGE_NAME:", data.get("name", ""))
          ig = (data.get("instagram_business_account") or {}).get("id", "")
          print("IG_BUSINESS_ACCOUNT_ID:", ig if ig else "(nenhuma conta ligada)")
          if "error" in data:
              print("PAGE_ERROR:", data["error"])
          if ig:
              r2 = requests.get(
                  f"{base}/{ig}",
                  params={"fields": "id,username", "access_token": token},
                  timeout=30,
              )
              print("IG_STATUS:", r2.status_code)
              d2 = r2.json()
              print("IG_ID:", d2.get("id", ""))
              print("IG_USERNAME:", d2.get("username", ""))
              if "error" in d2:
                  print("IG_ERROR:", d2["error"])
          PYEOF
