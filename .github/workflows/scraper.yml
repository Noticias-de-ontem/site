name: Weekly Data Extraction

on:
  schedule:
    # Corre todos os domingos à meia-noite UTC
    - cron: '0 0 * * 0'
  # Permite correr manualmente
  workflow_dispatch:

jobs:
  scrape_and_commit:
    runs-on: ubuntu-latest

    # Dá permissões de escrita ao token do GitHub Actions para podermos commitar de volta as atualizações dos JSONs
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Session File
        env:
          INSTA_SESSION_BASE64: ${{ secrets.INSTA_SESSION_BASE64 }}
        run: |
          if [ -n "$INSTA_SESSION_BASE64" ]; then
            echo "$INSTA_SESSION_BASE64" | base64 -d > instaloader.session
            echo "Session file created from secret."
          else
            echo "No session secret found, will fallback to direct login if credentials provided."
          fi

      - name: Run Scraper Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          INSTA_USERNAME: ${{ secrets.INSTA_USERNAME }}
          INSTA_PASSWORD: ${{ secrets.INSTA_PASSWORD }}
        run: python scraper.py

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pt/*.json scraper_progress.json scraper_resume/

          # Apenas commita se existirem alterações nos ficheiros
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update news database [skip ci]" && git push)
