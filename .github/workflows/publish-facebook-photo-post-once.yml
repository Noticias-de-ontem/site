name: Publish Facebook Photo Post Once (temp)

on:
  workflow_dispatch:

jobs:
  publish-facebook-photo-post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Upload photo as native feed post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          with open('pending_posts.json', 'r', encoding='utf-8') as f:
              posts = json.load(f)
          entry = next((p for p in posts if p.get('id') == 'pt_2026-10-27_1'), None)
          if entry is None:
              print('ERRO: post pt_2026-10-27_1 nao encontrado em pending_posts.json')
              sys.exit(1)
          option = entry['options'][entry.get('selected_option', 0)]
          caption = option.get('caption_facebook') or option.get('caption', '')
          image_url = option.get('image_url', '')
          if not caption or not image_url:
              print('ERRO: legenda ou image_url em falta no post aprovado')
              sys.exit(1)

          page_id = os.environ.get('FB_PAGE_ID', '')
          page_token = os.environ.get('FB_PAGE_ACCESS_TOKEN', '')
          if not page_id or not page_token:
              print('ERRO: FB_PAGE_ID ou FB_PAGE_ACCESS_TOKEN em falta')
              sys.exit(1)

          data = urllib.parse.urlencode({
              'url': image_url,
              'caption': caption,
              'published': 'true',
              'access_token': page_token,
          }).encode()
          req = urllib.request.Request(
              f'https://graph.facebook.com/v25.0/{page_id}/photos',
              data=data, method='POST',
          )
          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  result = json.loads(resp.read().decode())
          except urllib.error.HTTPError as e:
              print(f'ERRO Facebook: {e.read().decode()}')
              sys.exit(1)
          photo_id = result.get('id', '')
          if not photo_id:
              print(f'ERRO: resposta sem id: {result}')
              sys.exit(1)
          print(f"Foto publicada: https://www.facebook.com/{photo_id}")
          entry['facebook_id'] = photo_id
          entry['facebook_url'] = f'https://www.facebook.com/{photo_id}'
          with open('pending_posts.json', 'w', encoding='utf-8') as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'pending_posts.json'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Noticias de Ontem: atualizar id da foto da manha no Facebook (post nativo)'], check=True)
          subprocess.run(['git', 'push'], check=True)
          print('pending_posts.json atualizado com o novo id da foto')
          PYEOF
