name: Test EN publish once
on:
  workflow_dispatch:
jobs:
  test-en:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Publisher Script (EN test)
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          ENABLE_DIRECT_FB_PUBLISH: "true"
          ENABLE_EN_PUBLISH: "true"
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_SLOT: "1"
          FORCE_PUBLISH: "true"
          PUBLISH_IMMEDIATE: "1"
        run: python -u publisher.py

      - name: Build static site
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
        run: python -u build_site.py

      - name: Sync dynamic website
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: python -u scripts/sync_dynamic_site.py

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A

          if ! git diff --staged --quiet; then
            git commit -m "chore: update publish state"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push origin main; then
                echo "Push efetuado com sucesso."
                break
              fi
              echo "Tentativa $attempt falhou ao dar push; a tentar novamente..."
              sleep 3
            done
          fi
