name: Daily Instagram Publisher

on:
  schedule:
    # Corre de hora a hora entre as 07:00 e as 19:00 UTC (Ajustado para o Verão PT não exceder 22h locais)
    - cron: '0 7-19 * * *'
  # Permite correr manualmente
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup WARP
        timeout-minutes: 10
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Publisher Script
        timeout-minutes: 120
        env:
          PYTHONUNBUFFERED: "1"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARQUIVO_TEXTSEARCH_TIMEOUT: "90"
          ARQUIVO_HOMEPAGE_TIMEOUT: "60"
          ARQUIVO_CACHE_CURL_TIMEOUT: "90"
        run: python -u publisher.py

      - name: Build static site
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
        run: python -u build_site.py

      - name: Sync dynamic website
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: python -u sync_dynamic_site.py

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pt/*.json publish_state.json pending_posts.json pregeneration_state.json
          [ -f imgbb_uploads.json ] && git add imgbb_uploads.json || true
          [ -f social_metrics.json ] && git add social_metrics.json || true
          [ -d site ] && git add site || true

          # Apenas commita se existirem alterações nos ficheiros (marcados como publicados e estado de slot)
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update publish state [skip ci]" && git push)
