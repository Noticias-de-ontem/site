name: Daily Instagram Publisher

on:
  # O cron nativo do GitHub foi movido para o cron-job.org para garantir
  # o cumprimento pontual do horario (o GitHub schedule sofria atrasos de varias horas).
  # Para reativar o fallback nativo no GitHub se necessario, descomentar as linhas abaixo:
  # schedule:
  #   - cron: '0 7-19 * * *'

  # Permite correr manualmente ou via webhook/API externa (ex: cron-job.org)
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot a publicar (1=manha, 2=tarde/noite, auto=pela hora)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - '1'
          - '2'
      force:
        description: 'Forcar publicacao (ignora restricoes horarias normais)'
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Publisher Script
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TARGET_SLOT: ${{ inputs.slot || 'auto' }}
          FORCE_PUBLISH: ${{ inputs.force || 'false' }}
          PUBLISH_IMMEDIATE: "1"
        run: python -u publisher.py

      - name: Build static site
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
        run: python -u build_site.py

      - name: Sync dynamic website
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: python -u scripts/sync_dynamic_site.py

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pt/*.json publish_state.json pending_posts.json
          [ -f pregeneration_state.json ] && git add pregeneration_state.json || true
          [ -f imgbb_uploads.json ] && git add imgbb_uploads.json || true
          [ -f social_metrics.json ] && git add social_metrics.json || true
          [ -d site ] && git add site || true

          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: update publish state"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || (git rebase --abort && git pull --no-edit origin main)
              if git push origin main; then
                echo "Push efetuado com sucesso."
                break
              fi
              echo "Tentativa $attempt falhou ao dar push; a tentar novamente..."
              sleep 3
            done
          fi
