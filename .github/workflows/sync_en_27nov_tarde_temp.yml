name: sync EN tarde 27 nov (temp)

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync approved PT to EN
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          python -u -c "
          import json
          from en_sync import sync_approved_pt_to_en
          posts = json.load(open('pending_posts.json', encoding='utf-8'))
          n = sync_approved_pt_to_en(posts)
          json.dump(posts, open('pending_posts.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('synced:', n)
          "

      - name: Commit sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pending_posts.json site/images/approved/ 2>/dev/null || git add pending_posts.json
          git commit -m "chore: sync EN tarde 27 nov 2026 [skip ci]" || echo "nothing to commit"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin main && break || sleep 10; done
