name: Mirror Approved Images

# Espelha as imagens dos posts APROVADOS no proprio site, logo a seguir a
# aprovacao, para o publicador nunca depender do ImgBB (ou de outro servidor
# externo) na hora de publicar. Ver scripts/mirror_approved_images.py.
#
# Isto NAO faz a noticia aparecer no site antes de ser publicada: o
# build_site.py so inclui posts com status "published" no site.

on:
  push:
    paths:
      - pending_posts.json
  schedule:
    # Rede de seguranca: volta a tentar espelhos que falharam (ex.: ImgBB em baixo).
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mirror approved images
        run: python -u scripts/mirror_approved_images.py

      - name: Commit and Push changes
        id: commit
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: espelhar imagens aprovadas no site"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push origin main; then
                echo "Push efetuado com sucesso."
                break
              fi
              echo "Tentativa $attempt falhou ao dar push; a tentar novamente..."
              sleep 3
            done
            echo "committed=true" >> "$GITHUB_OUTPUT"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      # Pushes feitos com o GITHUB_TOKEN nao disparam o pages.yml, por isso o
      # deploy tem de ser pedido aqui — senao os espelhos ficam no repo sem
      # estarem servidos no site, e o publicador nao os consegue sacar.
      # O workflow_dispatch e uma excecao a regra de nao-recursao do GitHub.
      - name: Deploy site (publicar os espelhos)
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api "repos/${{ github.repository }}/actions/workflows/pages.yml/dispatches" -X POST -f ref=main
