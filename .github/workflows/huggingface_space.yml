name: Deploy Website to Hugging Face

on:
  push:
    branches:
      - main
      - master
    paths:
      - "site/**"
      - "build_site.py"
      - "pending_posts.json"
      - "imgbb_uploads.json"
      - "social_metrics.json"
      - "arquivo_cdxj_state.json"
      - "deploy_hf_space.py"
      - ".github/workflows/huggingface_space.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: huggingface-space
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      SITE_PUBLIC_URL: ${{ secrets.HF_SITE_PUBLIC_URL }}
      SITE_STATIC_ONLY: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"

      - name: Install static-site and Hugging Face dependencies
        run: python -m pip install "Pillow==12.3.0" "requests==2.34.2" "huggingface_hub>=1.0"

      - name: Build static site
        run: python -u build_site.py

      - name: Publish Static Space
        run: python -u deploy_hf_space.py
