name: Test Page like once
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Like and unlike an old post as the Page
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, requests

          TOKEN = os.environ["FB_PAGE_ACCESS_TOKEN"]
          # post da noite de 2 nov, ja republicado (existe no feed da Pagina PT)
          POST_ID = "1030669413467151_122137176890824703"
          BASE = f"https://graph.facebook.com/v25.0/{POST_ID}"

          def likes_count():
              r = requests.get(f"{BASE}/likes", params={"summary": "total_count", "limit": 0, "access_token": TOKEN}, timeout=30)
              try:
                  return r.status_code, (r.json().get("summary") or {}).get("total_count")
              except Exception:
                  return r.status_code, r.text[:200]

          print("likes antes:", likes_count())
          r = requests.post(f"{BASE}/likes", params={"access_token": TOKEN}, timeout=30)
          print("POST likes:", r.status_code, r.text[:300])
          print("likes depois de gostar:", likes_count())
          d = requests.delete(f"{BASE}/likes", params={"access_token": TOKEN}, timeout=30)
          print("DELETE likes:", d.status_code, d.text[:300])
          print("likes depois de tirar:", likes_count())
          PYEOF
