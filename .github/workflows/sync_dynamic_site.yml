name: Sync Dynamic Website

on:
  push:
    branches:
      - main
      - master
    paths:
      - "site/data/news.json"
      - "pending_posts.json"
      - "social_metrics.json"
      - "arquivo_cdxj_state.json"
      - "sync_dynamic_site.py"
      - ".github/workflows/sync_dynamic_site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Install sync dependency
        run: python -m pip install "requests==2.34.2"

      - name: Send current public data to the dynamic site
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: python -u sync_dynamic_site.py
