name: Check Buffer channels once
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: List Buffer channels and test post
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, requests, json, time

          KEY = os.environ["BUFFER_API_KEY"]
          IG_PT = os.environ["FB_PAGE_ACCESS_TOKEN"]
          IG_EN = os.environ["IG_ACCESS_TOKEN_EN"]

          def gql(query, variables=None):
              r = requests.post(
                  "https://api.buffer.com",
                  headers={"Authorization": f"Bearer {KEY}", "Content-Type": "application/json"},
                  json={"query": query, "variables": variables or {}},
                  timeout=30,
              )
              print("GraphQL status:", r.status_code)
              return r.json()

          # 1. conta e organizacao
          acc = gql("query { account { id email organizations { id name } } }")
          print("conta:", json.dumps(acc, indent=2)[:1200])
          orgs = (acc.get("data") or {}).get("account", {}).get("organizations") or []
          org_id = orgs[0]["id"] if orgs else None
          print("org_id:", org_id)

          # 2. canais
          ch = gql(
              "query GetChannels($organizationId: OrganizationId!) { channels(input: { organizationId: $organizationId }) { id name service serviceId } }",
              {"organizationId": org_id},
          )
          print("canais:", json.dumps(ch, indent=2)[:2000])
          fb_channels = [c for c in ((ch.get("data") or {}).get("channels") or []) if c.get("service") == "facebook"]
          print("canais FB:", fb_channels)

          # 3. post de teste em cada canal FB (imagem espelhada do post da noite)
          TEST_IMG = "https://i.ibb.co/pBLxg1sj/post-pt.jpg"
          TEST_TEXT = "Teste Buffer - Noticias de Ontem (publicacao de teste, apagar depois)."
          mut = """
          mutation CreatePost($input: CreatePostInput!) {
            createPost(input: $input) {
              ... on PostActionSuccess { post { id text status scheduledAt } }
              ... on MutationError { message }
            }
          }
          """
          for c in fb_channels:
              variables = {"input": {"text": TEST_TEXT, "channelId": c["id"], "schedulingType": "automatic", "mode": "shareNow", "assets": [{"image": {"url": TEST_IMG}}]}}
              resp = gql(mut, variables)
              print(f"teste {c.get('name')}:", json.dumps(resp, indent=2)[:800])

          # 4. confirmar no feed de cada Pagina (privacidade do post de teste)
          time.sleep(25)
          for label, page_id, token in (("PT", "1030669413467151", IG_PT), ("EN", "1318455601360516", IG_EN)):
              r = requests.get(
                  f"https://graph.facebook.com/v25.0/{page_id}/posts",
                  params={"fields": "id,privacy,permalink_url,created_time,message", "limit": 5, "access_token": token},
                  timeout=30,
              )
              print(label, "feed status:", r.status_code)
              print(r.text[:1200])
          PYEOF
