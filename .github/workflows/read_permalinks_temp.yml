name: read IG permalinks 27 nov (temp)

on:
  workflow_dispatch:

jobs:
  read:
    runs-on: ubuntu-latest
    steps:
      - name: Read permalinks
        env:
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          python -u -c "
          import os, requests
          for label, mid, tok in [('PT', '18020593328958744', os.environ['IG_ACCESS_TOKEN_PT']), ('EN', '18099564401697671', os.environ['IG_ACCESS_TOKEN_EN'])]:
              r = requests.get(f'https://graph.facebook.com/v25.0/{mid}', params={'fields': 'id,permalink,timestamp,media_type', 'access_token': tok}, timeout=60)
              print(label, r.status_code, r.text[:400])
          "
