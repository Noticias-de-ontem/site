name: Verify EN final once
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Verify EN token can publish
        env:
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
          IG_USER_ID_EN: ${{ secrets.IG_USER_ID_EN }}
        run: |
          python3 - <<'PYEOF'
          import os
          import requests

          token = os.environ.get("IG_ACCESS_TOKEN_EN", "")
          user_id = os.environ.get("IG_USER_ID_EN", "")
          base = "https://graph.facebook.com/v25.0"
          if not token or not user_id:
              print("FALTA segredo: IG_ACCESS_TOKEN_EN ou IG_USER_ID_EN nao definidos.")
              raise SystemExit(1)
          print("USER_ID_ESPERADO:", user_id == "17841435964827562")
          r = requests.get(
              f"{base}/{user_id}",
              params={"fields": "id,username", "access_token": token},
              timeout=30,
          )
          print("IG_STATUS:", r.status_code)
          d = r.json()
          print("IG_USERNAME:", d.get("username", "(vazio)"))
          if "error" in d:
              print("IG_ERROR:", d["error"])
          # Contentor de teste (rascunho nao publicado, expira em 24h): prova a permissao de publicar.
          r3 = requests.post(
              f"{base}/{user_id}/media",
              data={
                  "image_url": "https://www.noticiasdeontem.pt/assets/posts/2026-11-02-1-professores-realizam-greve-nacional-contra-o-oramento-do-estado.jpg",
                  "caption": "Teste de verificacao do token EN - rascunho, nao publicar.",
                  "access_token": token,
              },
              timeout=60,
          )
          print("CONTAINER_STATUS:", r3.status_code)
          d3 = r3.json()
          print("CONTAINER_ID_PRESENTE:", bool(d3.get("id")))
          if "error" in d3:
              print("CONTAINER_ERROR:", d3["error"])
          PYEOF
