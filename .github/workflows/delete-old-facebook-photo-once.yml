name: Delete Old Facebook Photo Once (temp)

on:
  workflow_dispatch:

jobs:
  delete-old-facebook-photo:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Delete the first morning photo
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          # Foto antiga (primeiro upload da manha, so visivel na aba Fotos)
          photo_id = '122136341120824703'
          page_token = os.environ.get('FB_PAGE_ACCESS_TOKEN', '')
          if not page_token:
              print('ERRO: FB_PAGE_ACCESS_TOKEN em falta')
              sys.exit(1)
          req = urllib.request.Request(
              f'https://graph.facebook.com/v25.0/{photo_id}?access_token={page_token}',
              method='DELETE',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print(f"Resposta da eliminacao: {resp.read().decode()}")
          except urllib.error.HTTPError as e:
              print(f'ERRO Facebook: {e.read().decode()}')
              sys.exit(1)
          PYEOF
