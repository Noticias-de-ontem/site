name: Check EN token me once
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Who is this EN token
        env:
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          python3 - <<'PYEOF'
          import os
          import requests

          token = os.environ.get("IG_ACCESS_TOKEN_EN", "")
          base = "https://graph.facebook.com/v25.0"
          if not token:
              print("FALTA segredo: IG_ACCESS_TOKEN_EN nao definido.")
              raise SystemExit(1)
          r = requests.get(
              f"{base}/me",
              params={"fields": "id,name,instagram_business_account", "access_token": token},
              timeout=30,
          )
          print("ME_STATUS:", r.status_code)
          d = r.json()
          print("ME_ID:", d.get("id", ""))
          print("ME_NAME:", d.get("name", ""))
          print("ME_IG_ID:", (d.get("instagram_business_account") or {}).get("id", "(sem conta ligada)"))
          if "error" in d:
              print("ME_ERROR:", d["error"])
          PYEOF
