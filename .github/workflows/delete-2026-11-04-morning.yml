name: Delete 2026-11-04 morning posts (once)
on:
  workflow_dispatch:
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old Facebook posts and stories
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          python3 - <<'PYEOF'
          import os
          import requests
          targets = [
              ("PT feed", "1030669413467151_122137455176824703", os.environ["FB_PAGE_ACCESS_TOKEN"]),
              ("EN feed", "1318455601360516_122097720633541219", os.environ["IG_ACCESS_TOKEN_EN"]),
              ("PT story", "1451903060375119", os.environ["FB_PAGE_ACCESS_TOKEN"]),
              ("EN story", "1782926549656592", os.environ["IG_ACCESS_TOKEN_EN"]),
          ]
          for label, post_id, token in targets:
              try:
                  r = requests.delete(
                      f"https://graph.facebook.com/v25.0/{post_id}",
                      params={"access_token": token},
                      timeout=60,
                  )
                  print(label, post_id, "->", r.status_code, r.text[:300], flush=True)
              except Exception as exc:
                  print(label, post_id, "-> EXC", exc, flush=True)
          PYEOF
