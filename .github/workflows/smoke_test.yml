name: Smoke Test - Publish One Real Post

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - run: python -m pip install "Pillow==13.0.0" "requests==2.34.2"

      - name: Run smoke test
        env:
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python - << 'EOF'
          import os, requests
          from PIL import Image, ImageDraw, ImageFont

          def make_test_image(text, path):
              img = Image.new('RGB', (1080, 1080), color=(20, 20, 80))
              draw = ImageDraw.Draw(img)
              try:
                  font = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf", 60)
                  small = ImageFont.truetype("/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf", 36)
              except:
                  font = small = ImageFont.load_default()
              draw.text((80, 400), "🧪 SMOKE TEST", fill=(255,200,0), font=font)
              draw.text((80, 500), text, fill=(255,255,255), font=small)
              draw.text((80, 560), "Este post é um teste.\nPode apagar.", fill=(200,200,200), font=small)
              img.save(path)

          def upload_imgbb(path, key):
              with open(path, 'rb') as f:
                  r = requests.post('https://api.imgbb.com/1/upload',
                      data={'key': key}, files={'image': f})
              d = r.json()
              if d.get('success'):
                  return d['data']['url']
              print("IMGBB error:", d)
              return None

          def publish_instagram(image_url, caption, token, user_id, lang):
              r1 = requests.post(
                  f"https://graph.facebook.com/v25.0/{user_id}/media",
                  data={'image_url': image_url, 'caption': caption, 'access_token': token}
              )
              d1 = r1.json()
              if 'id' not in d1:
                  print(f"[{lang}] Instagram container error:", d1)
                  return False
              r2 = requests.post(
                  f"https://graph.facebook.com/v25.0/{user_id}/media_publish",
                  data={'creation_id': d1['id'], 'access_token': token}
              )
              d2 = r2.json()
              if 'id' in d2:
                  print(f"[{lang}] ✅ Instagram published! Post ID: {d2['id']}")
                  return True
              print(f"[{lang}] ❌ Instagram publish error:", d2)
              return False

          def publish_facebook(message, image_url, page_id, page_token, lang):
              r = requests.post(
                  f"https://graph.facebook.com/v25.0/{page_id}/photos",
                  data={'url': image_url, 'caption': message, 'access_token': page_token},
                  timeout=60,
              )
              d = r.json()
              if d.get('id'):
                  print(f"[{lang}] ✅ Facebook published! Post ID: {d['id']}")
                  return True
              print(f"[{lang}] ❌ Facebook publish error:", d)
              return False

          imgbb_key = os.environ.get('IMGBB_API_KEY')
          caption = "🧪 Smoke test - Este post foi gerado automaticamente para testar o pipeline.\n\n#teste #smoketest"

          # Upload imagem uma vez (comum a todas as redes)
          image_url = None
          if imgbb_key:
              path = "smoke_test.jpg"
              make_test_image("Smoke test - Notícias de Ontem", path)
              image_url = upload_imgbb(path, imgbb_key)
              if not image_url:
                  print("IMGBB upload falhou - a testar apenas redes sem imagem")
          else:
              print("IMGBB_API_KEY não configurado")

          # ── Instagram ──
          token = os.environ.get('IG_ACCESS_TOKEN_PT')
          user_id = os.environ.get('IG_USER_ID_PT')
          if token and user_id:
              if image_url:
                  publish_instagram(image_url, caption, token, user_id, 'pt')
              else:
                  print("[pt] Instagram ignorado - sem imagem")
          else:
              print("[pt] Instagram ignorado - credenciais não configuradas")

          # ── Facebook ──
          page_id = os.environ.get('FB_PAGE_ID')
          page_token = os.environ.get('FB_PAGE_ACCESS_TOKEN')
          if page_id and page_token:
              fb_caption = caption
              publish_facebook(fb_caption, image_url, page_id, page_token, 'pt')
          else:
              print("[pt] Facebook ignorado - credenciais não configuradas")

          print("\nSmoke test concluído.")
          EOF
