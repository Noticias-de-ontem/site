name: Republish Facebook Feed

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Datas separadas por espaco (ex: 2026-10-27 2026-10-28)"
        required: false
        default: "2026-10-27 2026-10-28"
        type: string
      backdate:
        description: "Manter as datas originais na Timeline da Pagina (retroativo)"
        required: false
        default: true
        type: boolean

jobs:
  republish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Republish Script
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          BACKDATE_POSTS: ${{ inputs.backdate }}
        run: python scripts/republish_facebook_feed.py ${{ inputs.dates }}

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pending_posts.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore: update pending_posts with facebook feed urls"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main || (git rebase --abort && git pull --no-edit origin main)
              if git push origin main; then
                break
              fi
              sleep 3
            done
          fi
