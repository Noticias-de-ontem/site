name: Find EN FB morning post (once)
on:
  workflow_dispatch:
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: List recent posts on Yesterday's News page
        env:
          FB_PAGE_ID_EN: "1318455601360516"
          FB_PAGE_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          page = os.environ["FB_PAGE_ID_EN"]
          tok = os.environ["FB_PAGE_ACCESS_TOKEN_EN"]
          url = (f"https://graph.facebook.com/v25.0/{page}/posts"
                 f"?fields=id,message,created_time&limit=5&access_token={tok}")
          with urllib.request.urlopen(url, timeout=30) as r:
              data = json.load(r)
          for p in data.get("data", []):
              print("ID:", p.get("id"))
              print("CREATED:", p.get("created_time"))
              print("MSG:", (p.get("message") or "")[:160].replace("\n", " "))
              print("---")
          PY
