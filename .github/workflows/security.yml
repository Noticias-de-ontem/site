name: Dependency Security

on:
  pull_request:
    paths:
      - "**/requirements*.txt"
      - ".python-version"
      - ".github/workflows/security.yml"
  push:
    branches:
      - main
      - master
    paths:
      - "**/requirements*.txt"
      - ".python-version"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        requirements:
          - requirements.txt
          - backend/requirements.txt
          - backend/requirements-dev.txt
          - backend/indexer-requirements.txt

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.6"
          cache: pip
          cache-dependency-path: ${{ matrix.requirements }}

      - name: Audit resolved dependencies
        run: |
          python -m pip install --upgrade "pip==26.1.2" "pip-audit==2.10.1"
          python -m pip_audit --requirement "${{ matrix.requirements }}"
