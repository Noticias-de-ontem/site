name: Tests

on:
  # Manual ou em pushes que toquem código do pipeline/backend/site
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "*.py"
      - "backend/**"
      - "tests/**"
      - "requirements.txt"
  pull_request:
    paths:
      - "*.py"
      - "backend/**"
      - "tests/**"
      - "requirements.txt"

jobs:
  tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Static checks (ruff)
        run: |
          pip install ruff
          python -m ruff check --select E9,F63,F7,F82,F811,F821 --exclude .git,site,images,pt .

      - name: Run test suite
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m pytest tests/ -q
