name: Check caption once
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check published captions
        env:
          IG_TOKEN: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          FB_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import os, requests
          ig = os.environ["IG_TOKEN"]
          fb = os.environ["FB_TOKEN"]
          r = requests.get("https://graph.facebook.com/v25.0/17938644231401214", params={"fields": "caption,permalink,username", "access_token": ig}, timeout=30)
          print("IG media status:", r.status_code)
          print("IG media:", r.text[:1500])
          r = requests.get("https://graph.facebook.com/v25.0/1030669413467151_122137175186824703", params={"fields": "message", "access_token": fb}, timeout=30)
          print("FB post status:", r.status_code)
          print("FB post:", r.text[:1500])
          PYEOF
