name: Republish Story 9x16

on:
  # Permite correr manualmente
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Republish story in 9x16
        timeout-minutes: 30
        env:
          PYTHONUNBUFFERED: "1"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python3 - << 'PYEOF'
          import json, os, requests, sys
          import publisher
          posts = json.load(open('pending_posts.json', encoding='utf-8'))
          entry = next(p for p in posts if p.get('id') == 'pt_2026-10-28_1')
          old_ig = entry.get('instagram_story_id')
          old_fb = entry.get('facebook_story_id')
          print('old stories:', old_ig, old_fb)
          img = (entry.get('options') or [{}])[0].get('image_url')
          print('feed image:', img)
          ig_new = publisher.publish_instagram_story(img, 'pt')
          fb_new = publisher.publish_facebook_story(img)
          print('new stories:', ig_new, fb_new)
          if ig_new:
              entry['instagram_story_id'] = str(ig_new)
          if fb_new:
              entry['facebook_story_id'] = str(fb_new)
          with open('pending_posts.json', 'w', encoding='utf-8') as f:
              json.dump(posts, f, ensure_ascii=False, indent=4)
          if old_ig and ig_new:
              try:
                  token = publisher.IG_CREDENTIALS.get('pt', {}).get('token')
                  r = requests.delete(f"https://graph.facebook.com/v25.0/{old_ig}", params={"access_token": token}, timeout=30)
                  print('delete IG old:', r.status_code, r.text[:300])
              except Exception as e:
                  print('delete IG old failed:', e)
          if old_fb and fb_new:
              try:
                  page_token = os.environ.get('FB_PAGE_ACCESS_TOKEN', '')
                  r = requests.delete(f"https://graph.facebook.com/v25.0/{old_fb}", params={"access_token": page_token}, timeout=30)
                  print('delete FB old:', r.status_code, r.text[:300])
              except Exception as e:
                  print('delete FB old failed:', e)
          PYEOF

      - name: Build static site
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
        run: python -u build_site.py

      - name: Sync dynamic website
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: python -u scripts/sync_dynamic_site.py

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pt/*.json publish_state.json pending_posts.json
          [ -f pregeneration_state.json ] && git add pregeneration_state.json || true
          [ -f imgbb_uploads.json ] && git add imgbb_uploads.json || true
          [ -f social_metrics.json ] && git add social_metrics.json || true
          [ -d site ] && git add site || true

          # Apenas commita se existirem alterações nos ficheiros (marcados como publicados e estado de slot)
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update publish state" && git push)
