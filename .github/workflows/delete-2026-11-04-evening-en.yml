name: Delete EN Evening Facebook Post Once (temp)

on:
  workflow_dispatch:

jobs:
  delete-en-evening-facebook-post:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Delete the EN evening feed post
        env:
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          python3 - <<'PYEOF'
          import os
          import sys
          import urllib.request
          import urllib.error

          # EN evening post, 4 Nov 2026 (Obama 2008) - wrong photo, to republish with the PT photo
          post_id = '1318455601360516_122097887805541219'
          page_token = os.environ.get('IG_ACCESS_TOKEN_EN', '')
          if not page_token:
              print('ERRO: IG_ACCESS_TOKEN_EN em falta')
              sys.exit(1)
          req = urllib.request.Request(
              f'https://graph.facebook.com/v25.0/{post_id}?access_token={page_token}',
              method='DELETE',
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print(f"Resposta da eliminacao: {resp.read().decode()}")
          except urllib.error.HTTPError as e:
              print(f'ERRO Facebook: {e.read().decode()}')
              sys.exit(1)
          PYEOF
