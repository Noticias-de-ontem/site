name: Rescue Morning Publisher

on:
  # Permite correr manualmente
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch publisher for morning rescue (workspace only)
        run: |
          python3 - << 'PY'
          import pathlib
          p = pathlib.Path('publisher.py')
          t = p.read_text(encoding='utf-8')
          old_window = '            if 8 <= local_hour < 14 and morning_pending:\n                platforms_to_post.append((pname, "morning", 1))\n            elif 17 <= local_hour < 22 and evening_pending:'
          new_window = '            if 8 <= local_hour < 14 and morning_pending:\n                platforms_to_post.append((pname, "morning", 1))\n            elif local_date_str == "2026-10-28" and 14 <= local_hour < 17 and morning_pending:\n                platforms_to_post.append((pname, "morning", 1))\n            elif 17 <= local_hour < 22 and evening_pending:'
          assert t.count(old_window) == 1
          t = t.replace(old_window, new_window)
          old_lottery = '        last_hour_of_window = 13 if local_hour < 14 else 21\n        hours_left = 22 - local_hour\n        if local_hour != last_hour_of_window and hours_left > 0 and random.random() > 1.0 / max(hours_left, 1):'
          new_lottery = '        last_hour_of_window = 13 if local_hour < 14 else 21\n        hours_left = 22 - local_hour\n        is_morning_rescue = local_date_str == "2026-10-28" and 14 <= local_hour < 17\n        if not is_morning_rescue and local_hour != last_hour_of_window and hours_left > 0 and random.random() > 1.0 / max(hours_left, 1):'
          assert t.count(old_lottery) == 1
          t = t.replace(old_lottery, new_lottery)
          p.write_text(t, encoding='utf-8')
          print('workspace patch applied')
          PY
      - name: Run Publisher Script
        timeout-minutes: 120
        env:
          PYTHONUNBUFFERED: "1"
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARQUIVO_TEXTSEARCH_TIMEOUT: "90"
          ARQUIVO_HOMEPAGE_TIMEOUT: "60"
          ARQUIVO_CACHE_CURL_TIMEOUT: "90"
        run: python -u publisher.py

      - name: Build static site
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_USER_ID_PT: ${{ secrets.IG_USER_ID_PT }}
        run: python -u build_site.py

      - name: Sync dynamic website
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: python -u scripts/sync_dynamic_site.py

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add pt/*.json publish_state.json pending_posts.json
          [ -f pregeneration_state.json ] && git add pregeneration_state.json || true
          [ -f imgbb_uploads.json ] && git add imgbb_uploads.json || true
          [ -f social_metrics.json ] && git add social_metrics.json || true
          [ -d site ] && git add site || true

          # Apenas commita se existirem alterações nos ficheiros (marcados como publicados e estado de slot)
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update publish state" && git push)
