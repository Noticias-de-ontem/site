name: Sync EN 19nov tarde (temp)

on:
  schedule:
    # Every Sunday at 8am UTC
    - cron: '0 8 * * 0'
  # Permite correr manualmente
  workflow_dispatch:

jobs:
  pregenerate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Sync EN for approved PT posts
        run: |
          python3 - <<'PYEOF'
          import json
          from en_sync import sync_approved_pt_to_en
          posts = json.load(open('pending_posts.json', encoding='utf-8'))
          out = sync_approved_pt_to_en(posts)
          print('sync result:', out)
          json.dump(posts, open('pending_posts.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          PYEOF

      - name: Build static site
        run: python -u build_site.py

      - name: Sync dynamic website
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: python -u scripts/sync_dynamic_site.py

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Apenas adiciona os ficheiros que existem (evita erro na primeira execução)
          for f in pending_posts.json review_pt.html pregeneration_state.json imgbb_uploads.json arquivo_cdxj_state.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          [ -d images/review ] && git add images/review || true
          [ -d site ] && git add site || true

          # O site/data/news.json é um ficheiro gerado com timestamp e o
          # publicador regenera-o de 30 em 30 minutos; a pregeneração só
          # altera posts pendentes, que não entram no news.json. Não o enviar
          # daqui (tirar do stage e repor a versão do checkout), senão o
          # rebase conflita sempre que a main mexe a meio da run.
          git reset -q -- site/data/news.json 2>/dev/null || true
          git checkout -q -- site/data/news.json 2>/dev/null || true

          # Apenas commita se existirem alterações nos ficheiros
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync EN 19 nov tarde pending posts [skip ci]" && git pull --rebase --autostash origin main && git push)
