name: Republish preview once
on:
  workflow_dispatch:
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Render preview with fixed search
        env:
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import requests
          from publisher import create_image_with_text

          with open("pending_posts.json", encoding="utf-8") as f:
              pending = json.load(f)
          entry = next(x for x in pending if x.get("id") == "pt_2026-11-02_1")
          option = entry["options"][entry["selected_option"]]
          create_image_with_text(
              "EDUCAÇÃO",
              option["title"],
              "pt",
              output_path="republish_preview.jpg",
              description_to_draw=option.get("overlay_description", ""),
              highlight_text=option.get("highlight_text", ""),
              layout_name="breaking",
              layout_preference=option.get("layout_preference", "template_1"),
              breaking_candidate=bool(option.get("breaking_candidate", False)),
              background_query=option.get("image_theme", "") or option.get("title", ""),
              manual_background_url="",
              year=int(option["year"]),
              relevance_level=(option.get("relevance") or {}).get("level"),
          )
          print("PREVIEW_RENDERED")
          api_key = os.environ.get("IMGBB_API_KEY", "")
          with open("republish_preview.jpg", "rb") as fh:
              res = requests.post(
                  "https://api.imgbb.com/1/upload",
                  data={"key": api_key},
                  files={"image": fh},
                  timeout=60,
              )
          data = res.json()
          print("IMGBB_SUCCESS:", data.get("success"))
          print("PREVIEW_IMAGE_URL:", (data.get("data") or {}).get("url", ""))
          PYEOF
