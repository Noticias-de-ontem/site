name: Publish Facebook Two Step Once (temp)

on:
  workflow_dispatch:

jobs:
  publish-facebook-two-step:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Upload unpublished photo then attach to feed post
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json
          import os
          import subprocess
          import sys
          import urllib.parse
          import urllib.request
          import urllib.error

          with open('pending_posts.json', 'r', encoding='utf-8') as f:
              posts = json.load(f)
          entry = next((p for p in posts if p.get('id') == 'pt_2026-10-27_1'), None)
          if entry is None:
              print('ERRO: post pt_2026-10-27_1 nao encontrado em pending_posts.json')
              sys.exit(1)
          option = entry['options'][entry.get('selected_option', 0)]
          caption = option.get('caption_facebook') or option.get('caption', '')
          image_url = option.get('image_url', '')
          if not caption or not image_url:
              print('ERRO: legenda ou image_url em falta no post aprovado')
              sys.exit(1)

          page_id = os.environ.get('FB_PAGE_ID', '')
          page_token = os.environ.get('FB_PAGE_ACCESS_TOKEN', '')
          if not page_id or not page_token:
              print('ERRO: FB_PAGE_ID ou FB_PAGE_ACCESS_TOKEN em falta')
              sys.exit(1)

          def fb_post(path, fields):
              data = urllib.parse.urlencode(fields).encode()
              req = urllib.request.Request(
                  f'https://graph.facebook.com/v25.0/{path}',
                  data=data, method='POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      return json.loads(resp.read().decode()), None
              except urllib.error.HTTPError as e:
                  return None, e.read().decode()

          # Passo 1: carregar a foto como nao publicada
          result, err = fb_post(f'{page_id}/photos', {
              'url': image_url,
              'published': 'false',
              'temporary': 'true',
              'access_token': page_token,
          })
          photo_id = result.get('id', '') if result else ''
          if not photo_id:
              print(f'ERRO upload nao publicado: {err}')
              sys.exit(1)
          print(f'Foto nao publicada carregada: {photo_id}')

          # Passo 2: criar o post do feed a anexar a foto
          result, err = fb_post(f'{page_id}/feed', {
              'message': caption,
              'attached_media': json.dumps([{'media_fbid': photo_id}]),
              'published': 'true',
              'access_token': page_token,
          })
          post_id = result.get('id', '') if result else ''
          method = 'attached_media'
          if not post_id:
              print(f' attached_media falhou ({err}); a tentar object_attachment...')
              result, err = fb_post(f'{page_id}/feed', {
                  'message': caption,
                  'object_attachment': photo_id,
                  'published': 'true',
                  'access_token': page_token,
              })
              post_id = result.get('id', '') if result else ''
              method = 'object_attachment'
          if not post_id:
              print(f'ERRO feed: {err}')
              sys.exit(1)
          print(f'Feed post criado ({method}): https://www.facebook.com/{post_id}')

          entry['facebook_id'] = post_id
          entry['facebook_url'] = f'https://www.facebook.com/{post_id}'
          with open('pending_posts.json', 'w', encoding='utf-8') as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', 'github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'pending_posts.json'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Noticias de Ontem: atualizar id do post da manha no Facebook (fluxo em dois passos)'], check=True)
          subprocess.run(['git', 'push'], check=True)
          print('pending_posts.json atualizado com o id do post do feed')
          PYEOF
