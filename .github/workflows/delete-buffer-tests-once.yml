name: Delete Buffer test posts once
on:
  workflow_dispatch:
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the two Buffer test posts
        env:
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          python3 - <<'PYEOF'
          import os, requests

          for label, post_id, token in (
              ("PT", "1030669413467151_122137180370824703", os.environ["FB_PAGE_ACCESS_TOKEN"]),
              ("EN", "1318455601360516_122096313579541219", os.environ["IG_ACCESS_TOKEN_EN"]),
          ):
              r = requests.delete(
                  f"https://graph.facebook.com/v25.0/{post_id}",
                  params={"access_token": token},
                  timeout=30,
              )
              print(label, "DELETE:", r.status_code, r.text[:200])
              # verificar que ja nao existe
              g = requests.get(
                  f"https://graph.facebook.com/v25.0/{post_id}",
                  params={"fields": "id", "access_token": token},
                  timeout=30,
              )
              print(label, "GET apos apagar:", g.status_code, g.text[:200])
          PYEOF
