name: delete old feed posts 27 nov (temp)

on:
  workflow_dispatch:

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old IG and FB feed posts
        env:
          IG_ACCESS_TOKEN_PT: ${{ secrets.IG_ACCESS_TOKEN_PT }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          python -u -c "
          import os, requests
          def delete_and_check(label, url, token):
              r = requests.delete(url, params={'access_token': token}, timeout=60)
              print(label, 'DELETE', r.status_code, r.text[:300])
              g = requests.get(url, params={'access_token': token, 'fields': 'id'}, timeout=60)
              print(label, 'GET-after', g.status_code, g.text[:200])
              return r.status_code == 200
          results = {}
          results['ig_pt'] = delete_and_check('IG-PT', 'https://graph.facebook.com/v25.0/17995679226063641', os.environ['IG_ACCESS_TOKEN_PT'])
          results['ig_en'] = delete_and_check('IG-EN', 'https://graph.facebook.com/v25.0/17925626346459811', os.environ['IG_ACCESS_TOKEN_EN'])
          for label, ids in [('FB-PT', ['1030669413467151_122140429244824703', '122140429244824703']), ('FB-EN', ['1318455601360516_122114164821541219', '122114164821541219'])]:
              ok = False
              for pid in ids:
                  r = requests.delete(f'https://graph.facebook.com/v25.0/{pid}', params={'access_token': os.environ['FB_PAGE_ACCESS_TOKEN']}, timeout=60)
                  print(label, 'DELETE', pid, r.status_code, r.text[:300])
                  if r.status_code == 200:
                      ok = True
                      g = requests.get(f'https://graph.facebook.com/v25.0/{pid}', params={'access_token': os.environ['FB_PAGE_ACCESS_TOKEN'], 'fields': 'id'}, timeout=60)
                      print(label, 'GET-after', g.status_code, g.text[:200])
                      break
              results[label.lower().replace('-', '_')] = ok
          print('SUMMARY', results)
          "
