name: Rescue EN morning Facebook once
on:
  workflow_dispatch:
jobs:
  rescue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Publish the EN morning post to Facebook via Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID_PT: "6ae8e746e29c69a1713d9390"
          BUFFER_CHANNEL_ID_EN: "6ae8e746e29c69a1713d938f"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          python3 - <<'PYEOF'
          import os, json, requests
          from publisher import publish_to_buffer

          # imagem e legenda do post EN da manha, tal como saiu no Instagram
          media_id = "18123457861736406"
          r = requests.get(
              f"https://graph.facebook.com/v25.0/{media_id}",
              params={"fields": "media_url,caption", "access_token": os.environ["IG_ACCESS_TOKEN_EN"]},
              timeout=30,
          )
          print("IG media:", r.status_code)
          data = r.json()
          image_url = data.get("media_url")
          caption = data.get("caption")
          print("imagem:", image_url)
          print("legenda:", (caption or "")[:120])
          result = publish_to_buffer(caption, image_url, "en")
          print("publish_to_buffer:", result)
          if result and result.get("id"):
              posts = json.load(open("pending_posts.json", encoding="utf-8"))
              for p in posts:
                  if p["id"] == "en_2026-11-03_1":
                      p["facebook_id"] = str(result["id"])
                      p["facebook_url"] = result.get("permalink", "")
                      break
              with open("pending_posts.json", "w", encoding="utf-8") as f:
                  json.dump(posts, f, ensure_ascii=False, indent=4)
              print("pending_posts.json atualizado")
          # confirmar no feed da Pagina EN
          g = requests.get(
              "https://graph.facebook.com/v25.0/1318455601360516/posts",
              params={"fields": "id,privacy,permalink_url,created_time,message", "limit": 3, "access_token": os.environ["IG_ACCESS_TOKEN_EN"]},
              timeout=30,
          )
          print("EN feed:", g.status_code, g.text[:600])
          PYEOF
      - name: Commit pending_posts.json
        run: |
          git config user.name "Muse"
          git config user.email "muse@local"
          git add pending_posts.json
          git diff --cached --quiet || git commit -m "rescue: post EN da manha de 3 nov no Facebook via Buffer"
          git push
