name: Test Buffer publish once
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test publish_to_buffer and delete the test posts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_ID_PT: "6ae8e746e29c69a1713d9390"
          BUFFER_CHANNEL_ID_EN: "6ae8e746e29c69a1713d938f"
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
        run: |
          python3 - <<'PYEOF'
          import os, requests
          from publisher import publish_to_buffer

          TEST_IMG = "https://i.ibb.co/pBLxg1sj/post-pt.jpg"
          TEST_TEXT = "Teste Buffer - Noticias de Ontem (publicacao de teste, apagar depois)."
          results = {}
          for lang in ("pt", "en"):
              r = publish_to_buffer(TEST_TEXT, TEST_IMG, lang)
              print(lang, "publish_to_buffer:", r)
              results[lang] = r

          # apagar os posts de teste no Facebook e confirmar que desapareceram
          tokens = {"pt": os.environ["FB_PAGE_ACCESS_TOKEN"], "en": os.environ["IG_ACCESS_TOKEN_EN"]}
          for lang, r in results.items():
              if not r or not r.get("id"):
                  print(lang, "sem post para apagar")
                  continue
              post_id = r["id"]
              # so apagar se o ID for do Facebook (formato pagina_post); o ID
              # do Buffer nao apaga nada no Facebook.
              if "_" not in str(post_id):
                  print(lang, "ID e do Buffer, nao do Facebook; a saltar o delete:", post_id)
                  continue
              d = requests.delete(f"https://graph.facebook.com/v25.0/{post_id}", params={"access_token": tokens[lang]}, timeout=30)
              print(lang, "DELETE:", d.status_code, d.text[:200])
              g = requests.get(f"https://graph.facebook.com/v25.0/{post_id}", params={"fields": "id", "access_token": tokens[lang]}, timeout=30)
              print(lang, "GET apos apagar:", g.status_code, g.text[:150])
          PYEOF
