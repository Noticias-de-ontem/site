name: Regenerate today only (temp)

on:
  workflow_dispatch:

jobs:
  regen_today:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup WARP
        timeout-minutes: 10
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Keep regenerate flags only for 2026-11-12
        run: |
          python3 - <<'PYEOF'
          import json
          posts = json.load(open('pending_posts.json', encoding='utf-8'))
          backup = {p['id']: p.get('review_action', '') for p in posts}
          json.dump(backup, open('/tmp/flags_backup.json', 'w', encoding='utf-8'))
          cleared = 0
          for p in posts:
              if p.get('date') != '2026-11-12' and p.get('review_action') == 'regenerate':
                  p['review_action'] = ''
                  cleared += 1
          json.dump(posts, open('pending_posts.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          kept = [p['id'] for p in posts if p.get('review_action') == 'regenerate']
          print(f'flags limpas: {cleared}; ficam para regenerar: {kept}')
          PYEOF

      - name: Run Pregenerator Script (PT)
        timeout-minutes: 60
        env:
          PYTHONUNBUFFERED: "1"
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARQUIVO_TEXTSEARCH_TIMEOUT: "90"
          ARQUIVO_HOMEPAGE_TIMEOUT: "60"
          ARQUIVO_CACHE_CURL_TIMEOUT: "90"
        run: python -u pregenerator.py --lang pt --source-mode arquivo-first

      - name: Restore flags and regenerate review HTML
        run: |
          python3 - <<'PYEOF'
          import json
          backup = json.load(open('/tmp/flags_backup.json', encoding='utf-8'))
          posts = json.load(open('pending_posts.json', encoding='utf-8'))
          restored = 0
          for p in posts:
              want = backup.get(p['id'], '')
              if p.get('date') != '2026-11-12' and want:
                  p['review_action'] = want
                  restored += 1
          json.dump(posts, open('pending_posts.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print(f'flags repostas: {restored}')
          import pregenerator as pg
          pg.generate_review_files(posts, langs=['pt'])
          print('review_pt.html regenerado com as flags repostas')
          PYEOF

      - name: Build static site
        run: python -u build_site.py

      - name: Sync dynamic website
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: python -u scripts/sync_dynamic_site.py

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Apenas adiciona os ficheiros que existem (evita erro na primeira execução)
          for f in pending_posts.json review_pt.html pregeneration_state.json imgbb_uploads.json arquivo_cdxj_state.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          [ -d images/review ] && git add images/review || true
          [ -d site ] && git add site || true

          # O site/data/news.json é um ficheiro gerado com timestamp e o
          # publicador regenera-o de 30 em 30 minutos; não o enviar daqui.
          git reset -q -- site/data/news.json 2>/dev/null || true
          git checkout -q -- site/data/news.json 2>/dev/null || true

          # Apenas commita se existirem alterações nos ficheiros
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: regenerate 2026-11-12 only [skip ci]" && git pull --rebase --autostash origin main && git push)
