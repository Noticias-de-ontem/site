name: Publish EN Facebook stories once
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Publish the two EN stories on the EN Page
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          IG_ACCESS_TOKEN_EN: ${{ secrets.IG_ACCESS_TOKEN_EN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
        run: |
          python3 - <<'PYEOF'
          import os, json, requests
          from publisher import publish_facebook_story

          token = os.environ["IG_ACCESS_TOKEN_EN"]
          results = {}
          for entry_id, media_id in (
              ("en_2026-11-03_1", "18123457861736406"),
              ("en_2026-11-03_2", "17944920099367503"),
          ):
              r = requests.get(
                  f"https://graph.facebook.com/v25.0/{media_id}",
                  params={"fields": "media_url", "access_token": token},
                  timeout=30,
              )
              image_url = r.json().get("media_url")
              print(entry_id, "imagem IG:", (image_url or "")[:100])
              story_id = publish_facebook_story(image_url, "en")
              print(entry_id, "story EN:", story_id)
              if story_id:
                  results[entry_id] = str(story_id)
          if results:
              posts = json.load(open("pending_posts.json", encoding="utf-8"))
              for p in posts:
                  if p["id"] in results:
                      p["facebook_story_id"] = results[p["id"]]
              with open("pending_posts.json", "w", encoding="utf-8") as f:
                  json.dump(posts, f, ensure_ascii=False, indent=4)
              state = json.load(open("publish_state.json", encoding="utf-8"))
              en_fb = state.get("en", {}).get("facebook", {})
              if "en_2026-11-03_1" in results:
                  en_fb["morning_story_posted"] = True
              if "en_2026-11-03_2" in results:
                  en_fb["evening_story_posted"] = True
              with open("publish_state.json", "w", encoding="utf-8") as f:
                  json.dump(state, f, ensure_ascii=False, indent=4)
              print("pending_posts.json e publish_state.json atualizados")
          PYEOF
      - name: Commit state files
        run: |
          git config user.name "Muse"
          git config user.email "muse@local"
          git add pending_posts.json publish_state.json
          git diff --cached --quiet || git commit -m "rescue: stories EN de 3 nov na Pagina EN (a da noite estava na PT)"
          git push
