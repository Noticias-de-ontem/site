name: Sync EN pairs (temp)

on:
  workflow_dispatch:

jobs:
  sync_en:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup WARP
        timeout-minutes: 10
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.6'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Arquivo.pt responses and CDXJ index
        uses: actions/cache@v6
        with:
          path: |
            arquivo_cache.db
            arquivo_cdxj/
          key: arquivo-cache-${{ runner.os }}-v2
          restore-keys: |
            arquivo-cache-${{ runner.os }}-
            arquivo-cache-${{ runner.os }}-v2

      - name: Sync approved PT posts to EN
        timeout-minutes: 60
        env:
          PYTHONUNBUFFERED: "1"
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ARQUIVO_TEXTSEARCH_TIMEOUT: "90"
          ARQUIVO_HOMEPAGE_TIMEOUT: "60"
          ARQUIVO_CACHE_CURL_TIMEOUT: "90"
        run: |
          python -u - <<'PYEOF'
          import json
          from pathlib import Path
          from en_sync import sync_approved_pt_to_en
          p = Path("pending_posts.json")
          posts = json.loads(p.read_text(encoding="utf-8"))
          n = sync_approved_pt_to_en(posts)
          p.write_text(json.dumps(posts, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"[en_sync] entradas EN criadas/atualizadas: {n}")
          PYEOF

      - name: Build static site
        run: python -u build_site.py

      - name: Sync dynamic website
        env:
          SITE_API_URL: ${{ secrets.SITE_API_URL }}
          SITE_SYNC_TOKEN: ${{ secrets.SITE_SYNC_TOKEN }}
        run: python -u scripts/sync_dynamic_site.py

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          for f in pending_posts.json review_pt.html pregeneration_state.json imgbb_uploads.json arquivo_cdxj_state.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          [ -d site ] && git add site || true

          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: sync EN pairs for approved PT posts [skip ci]" && git pull --rebase --autostash origin main && git push)
